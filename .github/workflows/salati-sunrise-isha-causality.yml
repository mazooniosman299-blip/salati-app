name: Salati sunrise / Isha verified-source causality regression (NO DEPLOY)
on:
  push:
    branches: [fix/sunrise-isha-provenance-20261107]
    paths: ['.github/workflows/salati-sunrise-isha-causality.yml', 'tests/sunrise-isha-authority.cjs', 'prayer-engine.js']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-source-reproduction:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Reproduce and prevent official Sunrise/Isha mismatches
        run: node tests/sunrise-isha-authority.cjs
      - name: Run full cross-country and native scheduling regression without publishing
        run: |
          set -euo pipefail
          node tests/prayer-engine.cjs
          node tests/auto-city-times.cjs
          node tests/timezone-choice.cjs
          node tests/native-schedule.cjs
          node tests/local-prayer-privacy.cjs
          node tests/global-prayer-calendar-audit.cjs
          npm test
      - name: Capture real Chromium screens of the tested candidate (NO DEPLOY)
        run: |
          set -euo pipefail
          npm run build
          python3 -m pip install --quiet playwright pillow
          python3 -m playwright install --with-deps chromium
          BROWSER="$(python3 -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          sudo ln -sf "$BROWSER" /usr/bin/chromium
          # Reuse actual UI test with a pinned 7 Nov 2026 local-day fixture; do not simulate a screenshot.
          sed 's/datetime(2026,11,3,10,15,tzinfo=timezone.utc)/datetime(2026,11,7,10,15,tzinfo=timezone.utc)/' tests/current-design-visual-proof.py > tests/current-design-visual-proof-nov7-ci.py
          grep -F 'datetime(2026,11,7,10,15,tzinfo=timezone.utc)' tests/current-design-visual-proof-nov7-ci.py
          python3 tests/current-design-visual-proof-nov7-ci.py
          rm tests/current-design-visual-proof-nov7-ci.py
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('reports/current-design-visual-proof/metrics.json')
          data=json.loads(p.read_text())
          data['source']='Real Chromium screenshot of exact reviewed GitHub source, built locally in CI'
          data['commit_sha']=os.environ['GITHUB_SHA']
          data['fixed_test_utc']='2026-11-07T10:15:00Z'
          data['city']='Muscat (23.588, 58.3829), Asia/Muscat, Oman method'
          data['note']='Screenshots prove rendered UI for fixed test state; not worldwide official calendar certification or physical Android evidence'
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
          test -s reports/current-design-visual-proof/ar-times-390.png
          test -s reports/current-design-visual-proof/en-times-390.png
          test -s reports/current-design-visual-proof/metrics.json
      - name: Upload source-bound genuine browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salati-sunrise-isha-real-chromium-no-deploy
          retention-days: 30
          if-no-files-found: warn
          path: reports/current-design-visual-proof/
