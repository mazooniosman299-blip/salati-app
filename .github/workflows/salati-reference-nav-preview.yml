name: Salati — user reference nav and moving blue selection (PREVIEW)
on:
  push:
    branches:
      - preview/salati-reference-active-nav-20261101
    paths:
      - .github/workflows/salati-reference-nav-preview.yml
      - dist/preview-four-ui-changes-20261101.css
      - tests/preview-reader-below-ui-20261101.py
      - android/app/src/main/res/xml/prayer_widget_info.xml
      - android/app/src/main/res/layout/prayer_widget.xml
      - android/app/src/main/java/com/salati/prayer/PrayerWidget.java
      - dist/index.html
      - quran-controller.js
      - tests/preview-player-dark-dock-worldwide-20261101.py
      - tests/worldwide-prayer-integrity-20261101.cjs
      - dist/active-reference-nav-20261101.css
      - tests/preview-reference-active-nav-20261101.py
      - prayer-engine.js
      - native-adapter.js
permissions:
  contents: write
concurrency:
  group: salati-reference-moving-nav-preview
  cancel-in-progress: true
jobs:
  build-test-and-publish-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build exactly the existing Salati app, run original regression suite plus native widget assertions
        run: |
          npm ci
          npm run build
          npm test
          node tests/widget-active-outline.cjs
          node tests/worldwide-prayer-integrity-20261101.cjs
      - name: Verify Quran audio dock OUTSIDE parchment and seven responsive phone/tablet dimensions
        run: |
          python3 -m pip install --quiet playwright tinycss2 cssselect2 lxml pillow
          python3 -m playwright install --with-deps chromium
          BROWSER="$(python3 -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          sudo ln -sf "$BROWSER" /usr/bin/chromium
          python3 tests/preview-player-dark-dock-worldwide-20261101.py
          python3 tests/preview-reference-active-nav-20261101.py
      - name: Build independent original-UI Android APK with same app code
        run: |
          python3 scripts/prepare-android.py
          cd android
          bash gradlew :app:assembleDebug --no-daemon
      - name: Verify independently installable Android preview includes real updated source
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | grep -F "package: name='com.salati.prayer.preview'"
          unzip -p "$APK" assets/www/index.html | grep -F 'preview-four-ui-changes-20261101.css'
          unzip -p "$APK" assets/www/index.html | grep -F 'id="mushafPlayerSlot"' >/dev/null
          unzip -l "$APK" | grep -F 'assets/www/preview-sample-location-20261101.js'
          unzip -p "$APK" assets/www/preview-four-ui-changes-20261101.css | grep -F 'SALATI USER REVIEW 2026-11-01'
          unzip -p "$APK" assets/www/preview-four-ui-changes-20261101.css | grep -F 'overflow-y:auto!important'
          unzip -p "$APK" assets/www/index.html | grep -F 'Quran audio dock: directly below parchment' >/dev/null
          unzip -p "$APK" assets/www/index.html | grep -F 'active-reference-nav-20261101.css' >/dev/null
          unzip -p "$APK" assets/www/active-reference-nav-20261101.css | grep -F 'body.dark header>.site-nav button.nav-icon-button.active' >/dev/null
          unzip -p "$APK" res/layout/prayer_widget.xml >/dev/null 2>&1 || true
          unzip -p "$APK" assets/www/preview-four-ui-changes-20261101.css | grep -F 'grid-template-columns:repeat(6,minmax(0,1fr))'
          unzip -p "$APK" assets/www/app-v1.0.109.js | grep -qv 'تُحسب المواقيت على جهازك دون إرسال موقعك'
          mkdir -p /tmp/real-salati-four-ui-preview
          cp "$APK" /tmp/real-salati-four-ui-preview/salati-reference-nav-preview.apk
          sha256sum /tmp/real-salati-four-ui-preview/salati-reference-nav-preview.apk
      - name: Preserve phone screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salati-reference-moving-nav-screenshots
          path: |
            reports/player-dark-dock-20261101/
            reports/reference-nav-20261101/
          if-no-files-found: warn
          retention-days: 5
      - name: Publish stable direct-download GitHub prerelease (NEVER production)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="preview-salati-reference-nav-20261101"
          FILE="/tmp/real-salati-four-ui-preview/salati-reference-nav-preview.apk"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$FILE" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "صلاتي — شريط تنقل مطابق للصورة مع أزرق يتحرك بين الأقسام" \
              --prerelease \
              --notes "Preview only: the WHOLE bottom navigation is one graphite rounded capsule with six transparent tabs and white icons and labels. A blue rounded highlighted background follows whichever tab is currently open, not only Mushaf. Existing Quran dark dock and worldwide prayer integrity protection are retained; tests and screenshots cover all six tabs across multiple phone sizes. Original mosque and existing dark style retained. Different package com.salati.prayer.preview; official Salati app, signed APK and Cloudflare website are unchanged. Preview is debug-signed and NOT an update to the main app."
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets,isPrerelease,url > /tmp/release-verify.json
          python3 - <<'PY'
          import json,os
          p='/tmp/real-salati-four-ui-preview/salati-reference-nav-preview.apk'
          j=json.load(open('/tmp/release-verify.json'))
          assert j['isPrerelease'] is True
          assert any(a['name']==os.path.basename(p) and a['size']==os.stat(p).st_size for a in j['assets'])
          print('PASS: full-original-app tested preview APK is available as a verified GitHub Release asset')
          PY
