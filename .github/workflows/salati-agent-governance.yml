name: Salati request interpretation and diff scope (NO DEPLOY)
on:
  pull_request:
    branches: [production]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  request-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify signed version reference, 20 risk inventory and AI source-of-truth contract
        run: node tests/agent-governance-contract.cjs
      - name: Require exact per-request file scope, based on actual PR diff
        run: |
          git fetch --no-tags origin production:refs/remotes/origin/production
          node scripts/verify-change-scope.cjs origin/production
      - name: Validate original 20-risk mandate and every acceptance stage
        run: node scripts/verify-request-status.cjs
      - name: Verify unchanged, original 604-page Quran data
        run: node tests/quran-source-integrity.cjs
      - name: Generate actual runtime source/import graph
        run: node scripts/inventory-current-sources.cjs
      - name: Self-test PR conflict classifier
        run: node scripts/pr-conflict-review.cjs --self-test
      - name: Reject overlapping live source files across open PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/pr-conflict-review.cjs
      - name: Preserve live overlap report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salati-pr-source-overlap-evidence
          path: |
            reports/pr-overlap-latest.json
            reports/active-source-map.json
          if-no-files-found: warn
      - name: Explicitly mark limited validation
        run: echo "Source/scope contract only; NOT runtime browser visual reference, Android hardware, original-key signing, or production publication proof."

  real-browser-design-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build existing real source without publishing
        run: |
          npm ci
          npm run build
          python3 -m pip install --quiet playwright pillow tinycss2
          python3 -m playwright install --with-deps chromium
          BROWSER="$(python3 -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          sudo ln -sf "$BROWSER" /usr/bin/chromium
      - name: Audit the live CSS selectors, layer collisions, baseline parity and forbidden priorities
        run: |
          python3 tests/css-component-owner-audit.py
          python3 tests/canonical-css-maintainability.py
          python3 tests/css-cascade-equivalence.py
      - name: Prove JS bundle survives regeneration from real upstream source
        run: node tests/source-lifecycle-contract.cjs
      - name: Verify immutable user-provided mosque reference bytes
        run: node tests/reference-provenance.cjs
      - name: Screenshot the ACTUAL Salati six-tab app plus scrolled Quran, both languages, four viewports
        run: python3 tests/current-design-visual-proof.py
      - name: Verify dynamic DOM is owned by upstream source across tab, language and reload
        run: python3 tests/dynamic-source-runtime-browser.py
      - name: Self-test visual diff rejecting unauthorized pixels
        run: python3 tests/visual-scope-diff.py --self-test
      - name: Compare original production runtime with candidate ONLY for approved visual change
        run: |
          set -euo pipefail
          git fetch --no-tags origin production:refs/remotes/origin/production
          RUNTIME_DIFF="$(node -e 'const x=require("./scripts/verify-change-scope.cjs");process.stdout.write(x.requiresWebVisualDiff(x.changedPaths("origin/production"))?"yes":"no")')"
          if [[ "$RUNTIME_DIFF" == "yes" ]]; then
            export SALATI_BASELINE_DIR="$RUNNER_TEMP/salati-production-shots"
            git worktree add --detach "$RUNNER_TEMP/salati-production-reference" origin/production
            (
              cd "$RUNNER_TEMP/salati-production-reference"
              npm ci
              npm run build
              SALATI_PROJECT_ROOT="$PWD" SALATI_VISUAL_OUT="$SALATI_BASELINE_DIR" python3 "$GITHUB_WORKSPACE/tests/current-design-visual-proof.py"
            )
            python3 tests/visual-scope-diff.py --baseline "$SALATI_BASELINE_DIR" --candidate reports/current-design-visual-proof --manifest docs/requests/ACTIVE_CHANGE.json
          else
            echo 'No web visual-capable source files changed; unrelated screenshot parity not claimed.'
          fi
      - name: Always retain real source/visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salati-current-56-real-screenshots-and-computed-styles
          path: reports/current-design-visual-proof/
          if-no-files-found: warn

  isolated-pr-preview-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build real application for review without official release build
        run: |
          npm ci
          npm run build
      - name: Mark standalone nonindexed preview and validate production isolation
        run: |
          node scripts/create-isolated-preview.cjs
          node tests/isolated-preview-contract.cjs
      - name: Publish downloadable review artifact, NOT Cloudflare production
        uses: actions/upload-artifact@v4
        with:
          name: salati-ui-review-only-static-no-apk-no-deploy
          retention-days: 14
          if-no-files-found: error
          path: reports/isolated-pr-preview/

  android-debug-and-native-widget-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build exact repository source, verify regressions, prepare isolated debug Android
        run: |
          npm ci
          npm run build
          npm test
          python3 -m pip install --quiet pillow
          python3 scripts/prepare-android.py
          cd android
          bash gradlew :app:assembleDebug --no-daemon
          cd ..
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          # Debug preview is not the Cloudflare production release; keep release-size/signature gates untouched.
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging android/app/build/outputs/apk/debug/app-debug.apk | grep -F "com.salati.prayer.preview"
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          stage=Path('android/app/src/main/assets/www')
          apk=Path('android/app/build/outputs/apk/debug/app-debug.apk')
          assert stage.is_dir() and apk.is_file()
          with ZipFile(apk) as archive:
              names=set(archive.namelist())
              checked=0
              for source in stage.rglob('*'):
                  if not source.is_file():continue
                  rel='assets/www/'+source.relative_to(stage).as_posix()
                  assert rel in names, 'Missing staged Android file: '+rel
                  assert archive.read(rel)==source.read_bytes(), 'Debug preview bytes diverged: '+rel
                  checked+=1
          assert checked>=6, 'Unexpected incomplete WebView source staging'
          for required in ('index.html','salati-ui.css','app-v1.0.109.js','quran/data.json'):
              assert (stage/required).is_file(), 'Missing critical staged app asset: '+required
          print('PASS unsigned/debug preview contains',checked,'exact staged WebView files; NOT original signed release')
          PY
      - name: Exercise real Android 15 system WebView and native widget without skipping independent failures
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            set +e
            bash scripts/android-webview-smoke.sh
            WEBVIEW_RESULT=$?
            bash scripts/capture-widget-emulator.sh
            WIDGET_RESULT=$?
            echo "WebView emulator code: $WEBVIEW_RESULT"
            echo "Native widget emulator code: $WIDGET_RESULT"
            test "$WEBVIEW_RESULT" -eq 0 && test "$WIDGET_RESULT" -eq 0
      - name: Preserve genuine emulator screenshot evidence even on partial failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salati-five-issues-real-android-webview-widget-preview-not-signed
          path: |
            reports/android-webview-20261102/
            reports/native-widget-preview/
          if-no-files-found: warn
      - name: Delineate untested install-over-production and physical phone
        if: always()
        run: echo "Debug preview is not original-key signed. Physical device and install-over-original are NOT verified, and no production deployment is permitted."
