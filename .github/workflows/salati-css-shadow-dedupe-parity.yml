name: Salati - safely dedupe shadowed CSS only after 36 real browser comparisons (NO DEPLOY)
on:
  push:
    branches: [experiment/salati-css-shadow-dedupe-20261102]
    paths:
      - .github/workflows/salati-css-shadow-dedupe-parity.yml
      - scripts/dedupe-layered-css.py
permissions:
  contents: write
concurrency:
  group: salati-css-shadow-experiment
  cancel-in-progress: true
jobs:
  verify-shadowed-declarations:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build actual runtime source and pass all existing functions
        run: |
          npm ci
          npm run build
          npm test
          python3 -m pip install --quiet tinycss2 playwright pillow
      - name: Eliminate only shadowed SAME selector/layer/condition CSS declarations
        run: python3 scripts/dedupe-layered-css.py
      - name: Prove no visual/geometry change across 6 tabs x 6 phone widths
        run: |
          python3 -m playwright install --with-deps chromium
          BROWSER="$(python3 -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          sudo ln -sf "$BROWSER" /usr/bin/chromium
          python3 tests/css-cascade-equivalence.py
          python3 tests/css-component-owner-audit.py
          python3 tests/canonical-css-maintainability.py
      - name: Verify no code regression and exact same Android embedded files
        run: |
          npm test
          python3 scripts/prepare-android.py
          (cd android && bash gradlew :app:assembleDebug --no-daemon)
          python3 tests/apk-assets.py
          ! grep -n 'preview-sample-location' android/app/src/main/assets/www/index.html
      - name: Commit ONLY approved stylesheet to isolated experiment
        run: |
          git config user.name 'salati-css-parity[bot]'
          git config user.email 'actions@users.noreply.github.com'
          git add dist/salati-ui.css
          test "$(git diff --cached --name-only)" = "dist/salati-ui.css"
          git diff --cached --quiet && { echo "Expected optimization absent"; exit 1; }
          git commit -m 'refactor(css): remove identically-scoped shadowed declarations after real browser parity'
          git push origin HEAD:experiment/salati-css-shadow-dedupe-20261102
      - name: Preserve every proof and debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salati-css-shadow-debt-resolution-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            reports/css-debt-20261101/
            reports/css-source-maintainability.json
            reports/css-dedupe-20261102.json
            android/app/build/outputs/apk/debug/app-debug.apk
