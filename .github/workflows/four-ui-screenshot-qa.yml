name: Salati four screenshot root-cause acceptance (NO DEPLOY)
on:
  push:
    branches: [fix/four-root-ui-issues-20261101, release/salati-four-fixes-v114-20261101]
  pull_request:
    branches: [production]
permissions:
  contents: read
jobs:
  web-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the actual proposed site (without publishing)
        run: |
          npm ci
          npm run build
          npm test
      - name: Install browser and dependencies
        run: |
          python3 -m pip install playwright tinycss2 cssselect2 lxml pillow
          python3 -m playwright install --with-deps chromium
          BROWSER="$(python3 -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          sudo ln -sf "$BROWSER" /usr/bin/chromium
      - name: All four screenshot issues in real Chromium
        run: python3 tests/four-ui-screenshot-regressions-20261101.py
      - name: Existing Mushaf and four-voice selections
        run: |
          python3 tests/mushaf-legibility-20261101.py
          python3 tests/selection-refinement-20261101.py
          python3 tests/user-visual-audit-20261101.py
      - name: Archive four-device visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salati-four-screenshot-root-cause-evidence
          path: |
            reports/four-screenshot-regressions/
            reports/mushaf-acceptance/
            reports/user-visual-audit-20261101/
            reports/selection-refinement-20261101/
          if-no-files-found: ignore

  android-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare exactly matching offline website in Android WebView
        run: |
          npm ci
          npm run build
          python3 scripts/prepare-android.py
      - name: Ensure Android SDK 36 and signing utilities are available
        run: |
          SDK_MANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Build unsigned APK for safe local signing only — never publish
        working-directory: android
        run: |
          bash gradlew :app:assembleRelease -x verifyReleaseSigningIdentity --no-daemon
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Upload private staging APK and verification tools
        uses: actions/upload-artifact@v4
        with:
          name: salati-1.0.114-unsigned-for-original-key
          path: |
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            /usr/local/lib/android/sdk/build-tools/36.0.0/lib/apksigner.jar
            /usr/local/lib/android/sdk/build-tools/36.0.0/apksigner
          retention-days: 3
          if-no-files-found: error
