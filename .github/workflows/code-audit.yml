name: Salati full code checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  code:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Full JavaScript regression suite
        run: npm test
      - name: Compile the web app
        run: npm run build
      - name: Run remaining web/SEO/Quran DOM tests
        run: |
          node tests/quran-dom.cjs
          npm run test:seo
      - name: Verify committed JavaScript matches rebuilt release
        run: git diff --exit-code -- dist/app-v1.0.109.js dist/app.js
      - name: Audit production npm dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Android-independent Java unit policies
        run: bash scripts/test-audio-focus.sh
      - name: Native Quran background policy tests
        run: bash scripts/test-quran-background.sh

  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Prepare exact offline PWA payload for Android
        run: |
          npm ci
          npm run build
          python3 scripts/prepare-android.py
          test -f android/app/src/main/assets/www/style-v1.0.109.css
          test -f android/app/src/main/assets/www/app-v1.0.109.js
      - name: Accept licenses and install Android SDK 36
        run: |
          SDK_MANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Build unsigned debug APK
        working-directory: android
        run: bash gradlew :app:assembleDebug --no-daemon
      - name: Verify final APK's packaged web, mosque art and resources
        run: |
          python3 -m pip install --quiet pillow
          python3 tests/apk-assets.py
      - name: Confirm native widget resource is compiled into APK
        run: |
          AAPT2="${ANDROID_HOME}/build-tools/36.0.0/aapt2"
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          "$AAPT2" dump resources android/app/build/outputs/apk/debug/app-debug.apk | grep 'drawable/widget_prayer_active'


  whole-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse source and data, validate local assets and archive integrity
        run: python3 scripts/full-source-audit.py
      - name: Upload machine-readable audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salati-full-tree-audit
          path: reports/full-source-audit-latest.json
          if-no-files-found: ignore


  browser-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - name: Install real Chromium browser and UI test dependencies
        run: |
          python3 -m pip install playwright tinycss2 cssselect2 lxml
          python3 -m playwright install --with-deps chromium
          BROWSER="$(python3 -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          sudo ln -sf "$BROWSER" /usr/bin/chromium
      - name: Test dark theme and audio colors in Chromium
        run: |
          python3 tests/dark-matte.py
          python3 tests/audio-control-colors.py
      - name: Verify all five visual repairs in Chromium
        if: success() || failure()
        run: python3 tests/design-visual-regression.py
      - name: Upload restoration screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salati-restoration-latest-screenshots
          path: reports/design-restoration-2026-10-31/
          if-no-files-found: ignore
      - name: Test every core tab and interaction
        if: success() || failure()
        run: python3 tests/modern-instruments.py
      - name: Test service worker offline navigation
        if: success() || failure()
        run: python3 tests/offline-navigation.py
