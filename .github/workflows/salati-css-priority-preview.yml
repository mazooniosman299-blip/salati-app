name: Salati — priority-safe canonical CSS and Android preview verification
on:
  push:
    branches:
      - preview/salati-css-priority-audit-20261102
    paths:
      - scripts/prune-provable-css-priority.py
      - .github/workflows/salati-css-priority-preview.yml
      - tests/css-cascade-equivalence.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: salati-priority-preview-20261102
  cancel-in-progress: true
jobs:
  audit-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build canonical source and run complete original functionality suite
        run: |
          npm ci
          npm run build
          npm test
          node tests/worldwide-prayer-integrity-20261101.cjs
      - name: Narrow redundant CSS priority flags with an auditable AST
        run: |
          python3 -m pip install --quiet tinycss2 playwright pillow
          python3 scripts/prune-provable-css-priority.py
          python3 - <<'PY'
          import json
          r=json.load(open('reports/css-priority-narrowing.json'))
          assert r['removed_flags']>=15,r
          assert r['after_important']<r['baseline_important'],r
          print('PASS: CSS priorities reduced without weakening unrelated rules',r)
          PY
      - name: Compare EVERY visible CSS property against current production-compatible preview, all six tabs
        run: |
          python3 -m playwright install --with-deps chromium
          BROWSER="$(python3 -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          sudo ln -sf "$BROWSER" /usr/bin/chromium
          python3 tests/css-cascade-equivalence.py
          python3 tests/preview-css-root-review-20261101.py
          python3 tests/canonical-css-maintainability.py
      - name: Verify Android preview packaging and remove ephemeral baseline
        run: |
          rm -f dist/salati-ui-baseline.css
          python3 scripts/prepare-android.py
          cd android
          bash gradlew :app:assembleDebug --no-daemon
          cd ..
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -p "$APK" assets/www/salati-ui.css | grep -F '.nav-icon-button' >/dev/null
          if unzip -l "$APK" | grep -E 'assets/www/(salati-ui-baseline|design-restoration|preview-four-ui-changes|active-reference-nav|reference-layout-v|light-theme-v)'; then
            echo 'Unexpected legacy stylesheet in APK'; exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | grep -F 'com.salati.prayer.preview'
          sha256sum "$APK"
      - name: Keep verified canonical CSS as the SINGLE authored main-page source on preview branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/salati-ui.css
          if ! git diff --cached --quiet; then
            git commit -m 'refactor(css): remove proven-redundant priority flags after full computed-style parity'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Save Android preview and machine-readable audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salati-css-priority-verified-preview
          path: |
            reports/css-priority-narrowing.json
            reports/css-debt-20261101/
            reports/css-root-review-20261101/
            android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: warn
