name: Verify charcoal time-only Android widget (NO DEPLOY)
on:
  push:
    branches:
      - fix/widget-charcoal-time-pill-20261101
permissions:
  contents: read
concurrency:
  group: widget-gray-capsule-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-and-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test all old functionality and new widget shape
        run: |
          npm ci
          npm run build
          npm test
          node tests/widget-active-outline.cjs
      - name: Compile Android debug and unsigned release
        run: |
          python3 scripts/prepare-android.py
          cd android
          bash gradlew :app:assembleDebug :app:assembleRelease -x verifyReleaseSigningIdentity --no-daemon
      - name: Verify unchanged web payload
        run: |
          python3 scripts/verify-native-web-assets.py android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          test -s android/app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Capture real native RemoteViews on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -eux
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell wm size 1080x2340
            adb shell wm density 440
            mkdir -p reports/native-widget-preview
            adb shell am start -n com.salati.prayer/.WidgetPreviewActivity --ei active 4
            sleep 5
            adb exec-out screencap -p > reports/native-widget-preview/maghrib-active.png
            adb shell am force-stop com.salati.prayer
            adb shell am start -n com.salati.prayer/.WidgetPreviewActivity --ei active 2
            sleep 3
            adb exec-out screencap -p > reports/native-widget-preview/dhuhr-active.png
            python3 - <<'PY'
            from PIL import Image
            for name in ('maghrib-active','dhuhr-active'):
              image=Image.open('reports/native-widget-preview/'+name+'.png').convert('RGB')
              assert image.width==1080 and image.height==2340
              # Keep the actual Android renderer crop in evidence in addition
              # to the full screen. This is NOT a Photoshop or web CSS mockup.
              image.crop((0,110,1080,870)).save('reports/native-widget-preview/'+name+'-crop.png')
            print('PASS: Android 15 native widget rendered with Maghrib and Dhuhr selection states')
            PY
      - name: Preserve emulator screenshots and APK for visual approval
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salati-native-widget-test-only-not-for-installing-over-production
          path: |
            reports/native-widget-preview/
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: warn
          retention-days: 3
