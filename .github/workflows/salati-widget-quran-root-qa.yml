name: Salati — original widget text inset and vertical Quran scroll (AUDIT ONLY — NO DEPLOY)
on:
  push:
    branches: [fix/salati-production-root-audit-20261102]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: salati-widget-scroll-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and preserve all old functionality
        run: |
          npm ci
          npm run build
          npm test
          node tests/widget-active-outline.cjs
          node tests/widget-quran-no-regression-20261102.cjs
      - name: Verify wheel/touch Quran scroll across pages on phone and desktop
        run: |
          python3 -m pip install --quiet playwright pillow
          python3 -m playwright install --with-deps chromium
          python3 tests/widget-quran-scroll-browser-20261102.py
      - name: Build Android preview with original RemoteViews and Quran reader
        run: |
          python3 scripts/prepare-android.py
          python3 tests/android-asset-path-contract-20261102.py
          (cd android && bash gradlew :app:assembleDebug --no-daemon)
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify android/app/build/outputs/apk/debug/app-debug.apk
      - name: Require hardware accelerated Android emulator
        run: |
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Capture BOTH Dhuhr and Maghrib original launcher widget states
        timeout-minutes: 12
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 2048M
          ram-size: 2048M
          emulator-options: -accel on -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -camera-back none -camera-front none
          disable-animations: true
          script: |
            python3 -m pip install --quiet pillow
            bash scripts/capture-widget-emulator.sh
      - name: Keep browser and native screenshots for user visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salati-widget-and-vertical-scroll-preview-evidence
          retention-days: 14
          if-no-files-found: warn
          path: |
            reports/widget-quran-scroll-20261102/
            reports/native-widget-preview/
            android/app/build/outputs/apk/debug/app-debug.apk
