name: One-time Salati signed APK release transfer
on:
  push:
    branches:
      - fix/phone-visual-five-and-apk-20261031
    paths:
      - .github/workflows/publish-signed-apk-once.yml
permissions:
  contents: write
jobs:
  publish-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phone-visual-five-and-apk-20261031
          persist-credentials: true
      - name: Fetch original-key-signed APK from temporary release transfer
        env:
          SALATI_URI: "https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-fc48-8211-8e1a-332724a99a84/raw?se=2026-10-31T19%3A09%3A42Z&sp=r&sv=2026-02-06&sr=b&scid=efbdd9c6-4362-534a-980b-9b55f3d46a44&skoid=37f774a3-b6f2-4e56-9fdd-339e5d6e97f8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-31T01%3A48%3A06Z&ske=2026-11-01T01%3A48%3A06Z&sks=b&skv=2026-02-06&sig=/o5kclyS/%2Bo4%2BFm2519buY83uzk49N6YdBG/9QZg8rc%3D"
        run: |
          curl -fsSL --retry 3 --max-time 180 "$SALATI_URI" -o dist/downloads/salati-1.0.110.apk
          test "$(stat -c %s dist/downloads/salati-1.0.110.apk)" = 26024631
          echo "6008417361eefb81f9cc5aa3cfa9ca04a99147d86e777244fdfea8d1a1d6d42b  dist/downloads/salati-1.0.110.apk" | sha256sum --check
          unzip -tq dist/downloads/salati-1.0.110.apk >/dev/null
          unzip -p dist/downloads/salati-1.0.110.apk assets/www/index.html | grep -q 'design-restoration-v1.0.113.css'
      - name: Validate release package identity and original signature
        run: |
          SDK_MANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDK_MANAGER"
          "$SDK_MANAGER" "build-tools;36.0.0" >/dev/null
          TOOLS="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/36.0.0"
          "$TOOLS/apksigner" verify --verbose --print-certs dist/downloads/salati-1.0.110.apk > /tmp/signature.txt
          grep -q 'Signer #1 certificate SHA-256 digest: 559dec66ab13e86be17c661732f1d2b1751a63261ed7d7d353b857f693cf056e' /tmp/signature.txt
          "$TOOLS/zipalign" -c -p 4 dist/downloads/salati-1.0.110.apk
          "$TOOLS/aapt" dump badging dist/downloads/salati-1.0.110.apk | grep -q "package: name='com.salati.prayer' versionCode='111' versionName='1.0.110'"
      - name: Commit verified signed APK to PR branch and remove one-time transfer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/publish-signed-apk-once.yml
          git add dist/downloads/salati-1.0.110.apk
          git commit -m 'release(android): publish original-key signed Salati 1.0.110 APK (code 111)'
          git push origin HEAD:fix/phone-visual-five-and-apk-20261031
